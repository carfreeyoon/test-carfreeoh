<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>카프리오 비교 계산기</title>

  <meta property="og:type" content="website" />
  <meta property="og:title" content="카프리오 비교 계산기" />
  <meta property="og:description" content="카 라이프에 자유를 더하다, 카프리오!" />
  <meta property="og:image" content="https://compare-carfreeoh.com/caprio-og.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://compare-carfreeoh.com/caprio-og.png" />

  <script>
    (() => {

      const path = window.location.pathname;

      const isStatic =
        path.endsWith(".png") ||
        path.endsWith(".jpg") ||
        path.endsWith(".jpeg") ||
        path.endsWith(".gif") ||
        path.endsWith(".webp") ||
        path.endsWith(".svg") ||
        path.endsWith(".ico") ||
        path.endsWith(".css") ||
        path.endsWith(".js");

      if (isStatic) return;

      // 테스트 링크
      if (path.startsWith("/test")) {

          const query = window.location.search || "";

          location.replace(
              "https://test-carfreeoh.streamlit.app/" + query
          );

          return;
      }

      // 운영 링크
      const query = window.location.search || "";

      location.replace(
          "https://carfreeoh-rentcalculator.streamlit.app/" + query
      );

    })();
  </script>

</head>

<body></body>

</html>
